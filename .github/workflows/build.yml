name: Build iOS ADB Helper IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project ADBHelper.xcodeproj \
            -scheme ADBHelper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ADBHelper.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p build/Payload
          cp -R build/ADBHelper.xcarchive/Products/Applications/ADBHelper.app build/Payload/
          cd build
          zip -qry ADBHelper.ipa Payload
          ls -lh ADBHelper.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADBHelper-unsigned-IPA
          path: build/ADBHelper.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(plutil -extract CFBundleShortVersionString raw -o - ADBHelper/Info.plist)
          BUILD_NUM=${{ github.run_number }}
          TAG="v${VERSION}-b${BUILD_NUM}"
          TITLE="ADB Helper ${VERSION} · build ${BUILD_NUM}"

          # Collect commits since the previous release as the changelog.
          git fetch --tags --force >/dev/null 2>&1 || true
          PREV_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' 2>/dev/null || true)
          else
            CHANGES=$(git log -12 --pretty=format:'- %s' 2>/dev/null || true)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- 常规更新与问题修复"
          fi

          NOTES=$(cat <<EOF
          未签名 IPA，供 Sideloadly / AltStore 等工具用个人 Apple ID 签名安装。

          - 版本：${VERSION}（构建 #${BUILD_NUM}）
          - 提交：${{ github.sha }}

          本次更新：
          ${CHANGES}

          注意：免费 Apple ID 签名有效期 7 天，到期需重新签名。
          EOF
          )
          gh release create "$TAG" build/ADBHelper.ipa \
            --title "$TITLE" --notes "$NOTES" --latest
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
