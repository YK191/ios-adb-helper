name: Build iOS ADB Helper IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project ADBHelper.xcodeproj \
            -scheme ADBHelper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ADBHelper.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p build/Payload
          cp -R build/ADBHelper.xcarchive/Products/Applications/ADBHelper.app build/Payload/
          cd build
          zip -qry ADBHelper.ipa Payload
          ls -lh ADBHelper.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADBHelper-unsigned-IPA
          path: build/ADBHelper.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          TITLE="ADB Helper 1.0.0 · build ${{ github.run_number }}"
          NOTES=$(cat <<EOF
          未签名 IPA，供 Sideloadly / AltStore 等工具用个人 Apple ID 签名安装。

          - 版本：1.0.0（构建 #${{ github.run_number }}）
          - 提交：${{ github.sha }}
          - 功能：无线 ADB 连接、Shell、设备控制、应用/文件管理、截图、日志
          - 注意：免费 Apple ID 签名有效期 7 天，到期需重新签名。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" build/ADBHelper.ipa --clobber
          else
            gh release create "$TAG" build/ADBHelper.ipa \
              --title "$TITLE" --notes "$NOTES" --latest
          fi
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
