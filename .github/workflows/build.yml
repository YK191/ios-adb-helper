name: Build iOS ADB Helper IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project ADBHelper.xcodeproj \
            -scheme ADBHelper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ADBHelper.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p build/Payload
          cp -R build/ADBHelper.xcarchive/Products/Applications/ADBHelper.app build/Payload/
          cd build
          zip -qry ADBHelper.ipa Payload
          ls -lh ADBHelper.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ADBHelper-unsigned-IPA
          path: build/ADBHelper.ipa
          if-no-files-found: error
